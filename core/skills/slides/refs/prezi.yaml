  - "Portable prezi: EXE (Windows 10 64-bit, DirectX 11, dedicated or integrated graphics card) or ZIP (macOS 10.15+); YouTube videos still need internet."
  - "Exports each frame to PDF; can export to PPT; narrated video with zoom transitions; a camera mode with a '3D slide wheel'."
