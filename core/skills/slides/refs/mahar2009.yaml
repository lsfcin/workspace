contributions:
  - "93 business students watched the same narrated PowerPoint lecture, either static or with custom animation revealing content incrementally (3.4 animations per slide on average)."
  - "Static slides gave better recall, across gender, class year, academic standing and major."
  - "Authors' explanation: incremental reveal raised processing demands and cut each item's exposure time."
gaps:
