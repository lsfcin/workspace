contributions:
  - "Lists the Google Slides transitions: Dissolve, Fade, Slide from right, Slide from left, Flip, Cube, Gallery."
  - "Lists the object animations: Appear, Disappear, Fade in/out, Fly in/out from four sides, Zoom in, Zoom out, Spin."
  - "On PowerPoint import, a transition Slides lacks is removed with no replacement; an unsupported animation is swapped for one Slides deems suitable, most often Fade; delays survive but cannot be edited afterwards."
  - "Names Morph as a PowerPoint feature Google Slides lacks."
gaps:
  - "Dated 2023; Google may have added transitions since; no official list to check against."
