contributions:
  - "Make text and important visuals big enough to read from the back of the room; no point size given."
  - "Prefer fonts with consistent stroke thickness for distance reading; ensure sufficient text weight."
  - "Room light sets the ground: some suggest dark text on light in a light room, light text on dark in a darkened room."
  - "Use WCAG contrast guidance for text and graph colours even though the medium differs."
gaps:
