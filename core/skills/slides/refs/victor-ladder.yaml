contributions:
  - "Uses a car-steering simulation: first control time with a slider, then 'abstract over time' by drawing the whole trajectory, so the slider's job is 'absorbed into the static visual representation'."
  - "'Stepping back down': overlay the car at one moment on the all-time trajectory, chosen by slider or by pointing at the trajectory."
  - "Patterns such as oscillation that are hard to see at one moment become visible across all time."
